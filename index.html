<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#ff4f9a">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Happy Birthday Prathan ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
overflow:hidden;
}
/* MOBILE FULL SCREEN */

@media (max-width:768px){

body{
margin:0;
padding:0;
overflow:hidden;
background:#000;
}

.phone{

width:100vw !important;
height:100vh !important;

border-radius:0 !important;

border:none !important;

box-shadow:none !important;

margin:0 !important;

}

.content{
padding-left:20px;
padding-right:20px;
}

}

/* SAFE AREA FOR IPHONE */

@supports (padding:max(0px)) {

.phone{

padding-top:env(safe-area-inset-top);

padding-bottom:env(safe-area-inset-bottom);

padding-left:env(safe-area-inset-left);

padding-right:env(safe-area-inset-right);

}

}
/* Background Glow */

body::before{
content:'';
position:absolute;
width:500px;
height:500px;
background:#ff4f9a;
filter:blur(180px);
opacity:.25;
z-index:-1;
}

/* Phone */

.phone{

width:390px;
height:844px;

border-radius:55px;

overflow:hidden;

position:relative;

border:8px solid #111;

box-shadow:
0 0 60px rgba(255,255,255,.15);

}

/* Wallpaper Inside Phone */

.phone-wallpaper{

position:absolute;

inset:0;

background:
linear-gradient(
rgba(0,0,0,.15),
rgba(0,0,0,.55)
),
url('prathan1.jpeg');

background-size:cover;
background-position:center;
background-repeat:no-repeat;

z-index:-1;

}

/* Dynamic Island */

.island{

position:absolute;

top:12px;

left:50%;

transform:translateX(-50%);

width:130px;

height:34px;

background:black;

border-radius:30px;

}

/* Status Bar */

.status{

display:flex;

justify-content:space-between;

padding:20px 25px;

color:white;

font-size:14px;

font-weight:600;

}

/* Time */

.time{

text-align:center;

margin-top:50px;

color:white;

}

.time h1{

font-size:96px;

font-weight:300;

line-height:1;

}

.time p{

font-size:22px;

font-weight:500;

margin-top:10px;

}

/* Notification */

.notification{

width:90%;

margin:60px auto;

padding:18px;

border-radius:28px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(25px);

box-shadow:
0 8px 30px rgba(0,0,0,.25);

color:white;

animation:slideUp 1.5s ease;

}

.notification-title{

font-size:15px;

font-weight:700;

margin-bottom:10px;

}

.notification-text{

font-size:14px;

line-height:1.7;

}

@keyframes slideUp{

from{
opacity:0;
transform:translateY(100px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* Unlock Button */

.unlock{

position:absolute;

bottom:80px;

width:100%;

display:flex;

justify-content:center;

}

.unlock a{

text-decoration:none;

padding:16px 35px;

border-radius:40px;

background:rgba(255,255,255,.22);

backdrop-filter:blur(15px);

color:white;

font-weight:600;

transition:.4s;

}

.unlock a:hover{

background:white;

color:#ff4f9a;

transform:scale(1.05);

}

/* Home Indicator */

.home{

position:absolute;

bottom:20px;

left:50%;

transform:translateX(-50%);

width:140px;

height:5px;

background:white;

border-radius:20px;

}

/* Floating Hearts */

.hearts span{

position:absolute;

bottom:-50px;

animation:float 10s linear infinite;

}

@keyframes float{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

</style>

</head>

<body>

<div class="phone">

<div class="phone-wallpaper"></div>

<div class="island"></div>

<div class="status">
<span>5G</span>
<span>100%</span>
</div>

<div class="time">

<h1>12:00</h1>

<p>Friday, June 5</p>

</div>

<div class="notification">

<div class="notification-title">
❤️ Birthday Notification
</div>

<div class="notification-text">

Hey Prathan Maplai ❤️

Today isn't just another day...

It's the day an amazing soul came into this world 🎂

A special birthday surprise has been created by Kavixx just for you ✨

Tap below and unlock your birthday experience ❤️

</div>

</div>

<div class="unlock">

<a href="welcome.html">

🔓 Unlock Surprise

</a>

</div>

<div class="home"></div>

<div class="hearts"></div>

</div>

<script>

function createHeart(){

const heart=document.createElement("span");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";

heart.style.fontSize=
(20+Math.random()*20)+"px";

heart.style.animationDuration=
(6+Math.random()*5)+"s";

document.querySelector(".hearts")
.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

setInterval(createHeart,400);

</script>

</body>
</html>
