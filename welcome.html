<!-- welcome.html -->

<!-- Put Uyirey.mp3 and prathan1.jpeg in the same folder -->

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Prathan ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
background:#000;
overflow-y:auto;
padding:20px 0;
}

/* Phone */

.phone{
width:390px;
height:844px;

border-radius:55px;

position:relative;

overflow-y:auto;
overflow-x:hidden;

scroll-behavior:smooth;

border:8px solid #111;

box-shadow:0 0 60px rgba(255,255,255,.15);
}

.phone::-webkit-scrollbar{
width:0;
}

.phone{
-ms-overflow-style:none;
scrollbar-width:none;
}

/* Wallpaper */

.wallpaper{
position:absolute;
inset:0;

background:
linear-gradient(
rgba(0,0,0,.25),
rgba(0,0,0,.70)
),
url('prathan1.jpeg');

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* Dynamic Island */

.island{
position:absolute;
top:12px;
left:50%;
transform:translateX(-50%);
width:130px;
height:34px;
background:#000;
border-radius:30px;
}

/* Main Content */

.content{
position:relative;
z-index:2;
padding:90px 25px 30px;
text-align:center;
color:white;
}

.title{
font-size:34px;
font-weight:700;
margin-bottom:20px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px #ff85c2; }
to{ text-shadow:0 0 25px #ff4f9a; }
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(20px);
padding:25px;
border-radius:30px;
line-height:1.8;
font-size:15px;
box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.typing{
border-right:2px solid white;
white-space:pre-line;
overflow:hidden;
animation:blink .8s infinite;
}

@keyframes blink{
50%{border-color:transparent;}
}

/* Friendship Meter */

.meter{
margin-top:25px;
text-align:left;
}

.bar{
height:12px;
border-radius:20px;
background:rgba(255,255,255,.2);
margin-top:6px;
margin-bottom:12px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#ff4f9a,#ff85c2);
}

/* Button */

.next-btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
border-radius:40px;
background:linear-gradient(45deg,#ff4f9a,#ff85c2);
color:white;
text-decoration:none;
font-weight:600;
box-shadow:0 0 25px rgba(255,79,154,.5);
transition:.4s;
}

.next-btn:hover{
transform:scale(1.08);
}

/* Hearts */

.hearts span{
position:absolute;
bottom:-50px;
animation:float 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* Home Indicator */

.home{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:140px;
height:5px;
background:white;
border-radius:20px;
}


</style>

</head>

<body>

<audio autoplay loop>
<source src="Uyirey.mp3" type="audio/mpeg">
</audio>

<div class="phone">

<div class="wallpaper"></div>

<div class="island"></div>

<div class="content">

<h1 class="title">
❤️ Welcome Prathan Maplai ❤️
</h1>

<div class="card">

<div id="typewriter" class="typing"></div>

<div class="meter">

<p>Friendship Level ❤️</p>
<div class="bar"><div class="fill"></div></div>

<p>Trust Level 🤝</p>
<div class="bar"><div class="fill"></div></div>

<p>Care Level 🌸</p>
<div class="bar"><div class="fill"></div></div>

<p>Replaceability 😎</p>
<div class="bar">
<div style="width:0%;height:100%;background:white;"></div>
</div>

</div>

</div>

<a href="memories.html" class="next-btn">
✨ Continue Journey ✨
</a>

</div>

<div class="home"></div>

<div class="hearts"></div>

</div>

<script>

const text = `Loading Birthday Experience...

██████████ 100%

Access Granted ✅

Hello Birthday Girl 🎂

Innaiku oru normal day illa...

Because innaiku dhaan indha world ku oru amazing soul vandha naal ❤️

Thank you for every laugh 😄

Thank you for every memory 📸

Thank you for every support ✨

Nee romba special di Prathan ❤️
`;

let i=0;

function typeWriter(){

if(i<text.length){

document.getElementById("typewriter").innerHTML += text.charAt(i);

i++;

setTimeout(typeWriter,40);

}

}

typeWriter();

function createHeart(){

const heart=document.createElement("span");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";

heart.style.fontSize=(20+Math.random()*20)+"px";

heart.style.animationDuration=(6+Math.random()*5)+"s";

document.querySelector(".hearts")
.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

setInterval(createHeart,400);

</script>

</body>
</html>
